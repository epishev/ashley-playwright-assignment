name: Playwright tests

on:
  # Every pull request (same repository or fork) is tested merged with its target branch.
  pull_request:
  # Pushes run only on the default branch, so a branch with an open pull request is not tested twice.
  push:
    branches: [main]
  workflow_dispatch:

# A newer run for the same pull request or branch replaces an obsolete one. The group name includes the
# pull request number or the ref, so runs of other branches are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run report:allure:generate

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
          if-no-files-found: ignore
